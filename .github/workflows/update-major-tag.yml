name: Update major version tag

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  update-major-tag:
    runs-on: ubuntu-latest
    steps:
      - name: Validate release tag
        id: version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "major=v${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
          else
            echo "Skipping non-release tag: $RELEASE_TAG"
          fi
      - uses: actions/checkout@v7
        if: steps.version.outputs.major != ''
      - name: Update major tag
        if: steps.version.outputs.major != ''
        env:
          MAJOR_TAG: ${{ steps.version.outputs.major }}
        run: |
          git tag --force "$MAJOR_TAG" "${GITHUB_SHA}^{commit}"
          git push --force origin "refs/tags/$MAJOR_TAG"
